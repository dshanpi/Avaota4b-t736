# T736 Xorg startup mode for the fixed HDMI desktop configuration.
# Xorg names the kernel card0-HDMI-A-1 connector as HDMI-1.
Section "Monitor"
    Identifier "T736 HDMI 1080p"
    Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +HSync +VSync
    Option "PreferredMode" "1920x1080"
    Option "Primary" "true"
EndSection

Section "Device"
    Identifier "T736 display engine"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "AccelMethod" "glamor"
    Option "SWcursor" "true"
    Option "PageFlip" "false"
    Option "Monitor-HDMI-1" "T736 HDMI 1080p"
EndSection

Section "Screen"
    Identifier "T736 Screen"
    Device "T736 display engine"
    Monitor "T736 HDMI 1080p"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080"
        Virtual 1920 1080
    EndSubSection
EndSection
